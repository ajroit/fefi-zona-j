name: Scrape FEFI & Futsal

on:
  schedule:
    - cron: '0 4 * * *'                      # Diario de control (01:00 AR)
    - cron: '0 12,14,16,18,20,22 * * 6,0'    # Sab/Dom 9:00 a 19:00 AR
    - cron: '0 0 * * 0,1'                    # Sab/Dom 21:00 AR

  push:
    paths:
      - 'scraper/**'
      - '.github/workflows/scrape.yml'

  workflow_dispatch:

permissions:
  contents: write

# FIX: evita que dos corridas simultáneas (cron + push) se pisen al hacer git push
concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # FIX: los secrets van a nivel de JOB. Si se declaran en el propio step,
    # `env.X` NO está disponible dentro del `if:` de ese mismo step.
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        run: pip install -r scraper/requirements.txt

      # FIX: los rivales "antes" se calculan con la MISMA lógica que los "después".
      # Antes se leían de predictions.json con otro formato, así que nunca coincidían
      # y el predictor se disparaba en cada corrida.
      - name: Snapshot rivales ANTES
        id: pre-rivals
        run: echo "rivals=$(python scraper/next_rivals.py)" >> $GITHUB_OUTPUT

      # FIX: se agregó reducido, que faltaba en el backup
      - name: Backup datos previos
        run: |
          mkdir -p /tmp/old
          for f in futsal-data futsal-reducido-data futsal-femenino-data fefi-data; do
            cp "data/$f.json" "/tmp/old/$f.json" 2>/dev/null || true
          done

      # FIX: cada scraper es independiente. Si uno falla (FEFI 403, Weball caída),
      # los demás siguen y SÍ se commitea lo que sí funcionó.
      # El job igual termina en rojo al final para que te llegue la notificación.
      - name: Run FEFI scraper
        id: s_fefi
        continue-on-error: true
        run: python scraper/scraper_fefi.py

      - name: Run Futsal fetcher
        id: s_futsal
        continue-on-error: true
        run: python scraper/scraper_futsal.py

      - name: Run Futsal Reducido fetcher
        id: s_reducido
        continue-on-error: true
        run: python scraper/scraper_futsal_reducido.py

      - name: Run Futsal Femenino fetcher
        id: s_femenino
        continue-on-error: true
        run: python scraper/scraper_futsal_femenino.py

      - name: Run Futsal Stats compiler
        id: s_stats
        continue-on-error: true
        run: python scraper/scraper_stats.py

      # FIX: si los secrets de Telegram no están cargados, el paso se saltea
      # en vez de romper la corrida.
      - name: Notify Telegram (Futsal Schedules)
        id: s_telegram
        continue-on-error: true
        if: ${{ env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: python scraper/notify_telegram.py

      - name: Detectar rivales DESPUÉS
        id: post-rivals
        run: echo "rivals=$(python scraper/next_rivals.py)" >> $GITHUB_OUTPUT

      - name: Ejecutar predictor si cambió el rival
        id: s_predictor
        continue-on-error: true
        if: ${{ steps.post-rivals.outputs.rivals != '' && steps.pre-rivals.outputs.rivals != steps.post-rivals.outputs.rivals && env.GEMINI_API_KEY != '' }}
        run: |
          echo "🔮 Rivales cambiaron"
          echo "   Antes: ${{ steps.pre-rivals.outputs.rivals }}"
          echo "   Ahora: ${{ steps.post-rivals.outputs.rivals }}"
          python scraper/predictor.py

      # FIX: git push pelado fallaba con "non-fast-forward" cuando entraba
      # otro commit mientras corría el scraper. Ahora hace rebase y reintenta.
      - name: Commit & push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "ℹ️ Sin cambios — no se commitea"
            exit 0
          fi

          git add data/
          git commit -m "🤖 update data $(date -u +'%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && {
              echo "✅ Datos actualizados"
              exit 0
            }
            echo "⚠️ Push falló (intento $i), reintentando en 5s..."
            sleep 5
          done
          echo "❌ No se pudo pushear después de 3 intentos"
          exit 1

      # Resumen legible + marca el job en rojo si algo falló, pero DESPUÉS de commitear
      - name: Resumen
        if: always()
        run: |
          fail=0
          check() {
            if [[ "$2" == "failure" ]]; then echo "❌ $1"; fail=1; else echo "✅ $1"; fi
          }
          check "FEFI"             "${{ steps.s_fefi.outcome }}"
          check "Futsal"           "${{ steps.s_futsal.outcome }}"
          check "Reducido"         "${{ steps.s_reducido.outcome }}"
          check "Femenino"         "${{ steps.s_femenino.outcome }}"
          check "Stats"            "${{ steps.s_stats.outcome }}"
          check "Telegram"         "${{ steps.s_telegram.outcome }}"
          check "Predictor"        "${{ steps.s_predictor.outcome }}"
          exit $fail
